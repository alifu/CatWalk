name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Test on an iOS simulator
        run: |
          xcodebuild test \
            -scheme CatWalk \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -skipPackagePluginValidation \
            -quiet

      - name: Build for Release (inspector compiled out)
        run: |
          xcodebuild build \
            -scheme CatWalk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -quiet
